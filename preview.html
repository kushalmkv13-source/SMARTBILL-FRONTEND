<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Preview</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
    background:#f5f7fb;
    padding:40px;
    font-family:Inter,sans-serif;
}

.invoice{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    padding:40px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.logo h2{
    color:#2563eb;
    font-weight:700;
}

.invoice-title{
    text-align:right;
}

.invoice-title h1{
    font-size:38px;
    font-weight:700;
}

.table thead{
    background:#2563eb;
    color:white;
}

.total-box{
    width:350px;
    margin-left:auto;
}

.total-box table td{
    padding:8px;
}

.grand{
    font-size:22px;
    font-weight:bold;
    color:#2563eb;
}

.buttons{
    text-align:center;
    margin-top:30px;
}

.buttons button{
    margin:10px;
}

@media print{

body{
background:white;
padding:0;
}

.buttons{
display:none;
}

.invoice{
box-shadow:none;
border:none;
}

}

</style>

</head>
<body>

<div class="invoice" id="invoice">

<div class="header">

<div class="logo">

<h2 id="companyName">Smart Billing</h2>

<p id="companyAddress">Company Address</p>

</div>

<div class="invoice-title">

<h1>INVOICE</h1>

<p><b>Invoice No :</b> <span id="invoiceNo"></span></p>

<p><b>Date :</b> <span id="date"></span></p>

</div>

</div>

<hr>

<div class="row mb-4">

<div class="col-md-6">

<h5>Bill To</h5>

<p><b>Name :</b> <span id="customerName"></span></p>

<p><b>Phone :</b> <span id="phone"></span></p>

<p><b>Email :</b> <span id="email"></span></p>

</div>

<div class="col-md-6 text-end">

<p><b>Payment :</b> Cash</p>

<p><b>Status :</b> Paid</p>

</div>

</div>

<table class="table table-bordered">

<thead>

<tr>

<th>#</th>

<th>Product</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

</tr>

</thead>

<tbody id="productBody">

</tbody>

</table>

<div class="total-box">

<table class="table">

<tr>

<td>Subtotal</td>

<td class="text-end" id="subtotal"></td>

</tr>

<tr>

<td>GST</td>

<td class="text-end" id="gst"></td>

</tr>

<tr>

<td>Discount</td>

<td class="text-end" id="discount"></td>

</tr>

<tr class="grand">

<td>Grand Total</td>

<td class="text-end" id="grandTotal"></td>

</tr>

</table>

</div>

<div class="mt-5">

<h6>Notes</h6>

<p id="notes">
Thank you for your business.
</p>

</div>

</div>

<div class="buttons">

<button class="btn btn-primary" onclick="window.print()">
🖨 Print
</button>

<button class="btn btn-success" onclick="downloadPDF()">
⬇ Download PDF
</button>

<button class="btn btn-secondary" onclick="history.back()">
⬅ Back
</button>

</div>

<script>

const invoice = JSON.parse(localStorage.getItem("invoice"));

if(invoice){

document.getElementById("companyName").innerHTML =
invoice.companyName || "Smart Billing";

document.getElementById("companyAddress").innerHTML =
invoice.companyAddress || "";

document.getElementById("invoiceNo").innerHTML =
invoice.invoiceNo || "";

document.getElementById("date").innerHTML =
invoice.date || "";

document.getElementById("customerName").innerHTML =
invoice.customerName || "";

document.getElementById("phone").innerHTML =
invoice.phone || "";

document.getElementById("email").innerHTML =
invoice.email || "";

document.getElementById("subtotal").innerHTML =
"₹ "+invoice.subtotal;

document.getElementById("gst").innerHTML =
"₹ "+invoice.gst;

document.getElementById("discount").innerHTML =
"₹ "+invoice.discount;

document.getElementById("grandTotal").innerHTML =
"₹ "+invoice.grandTotal;

document.getElementById("notes").innerHTML =
invoice.notes || "Thank you for your business.";

let body=document.getElementById("productBody");

invoice.products.forEach((item,index)=>{

body.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.qty}</td>

<td>₹ ${item.price}</td>

<td>₹ ${item.total}</td>

</tr>

`;

});

}

function downloadPDF(){

const element=document.getElementById("invoice");

html2pdf().from(element).save("Invoice.pdf");

}

</script>

</body>
</html>
